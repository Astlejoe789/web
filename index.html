<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astle Joe | Resume</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #1e1e1e;
      color: white;
    }
    header {
      background: #2e2e2e;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 1rem;
    }
    .hero {
      text-align: center;
      padding: 2rem;
    }
    .hero img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 3px solid #fff;
    }
    .hero h1 {
      margin-top: 1rem;
    }
    #cube-container {
      width: 100vw;
      height: 50vh;
    }
    .restaurant-style {
      padding: 2rem;
      background: #292929;
      border-radius: 10px;
      margin: 2rem;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }
    button {
      padding: 0.5rem 1rem;
      background: #ff6347;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
    }
    .certificates {
      display: none;
      padding: 1rem;
      background: #333;
    }
    .certificates img {
      max-width: 100%;
      height: auto;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <header>
    <h2>Astle Joe</h2>
    <nav>
      <a href="#">Home</a>
      <a href="#cert">Certificates</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <img src="your-photo.jpg" alt="Astle Joe" />
    <h1>Hello, I'm Astle Joe</h1>
    <p>First-year student passionate about tech, design, and leadership.</p>
  </section>

  <div id="cube-container"></div>

  <section class="restaurant-style">
    <h2>My Skills</h2>
    <ul>
      <li>HTML, CSS, JavaScript</li>
      <li>Python, C</li>
      <li>Django & GitHub</li>
    </ul>
  </section>

  <section id="cert" class="restaurant-style">
    <h2>Certificates</h2>
    <button onclick="document.getElementById('cert-section').style.display='block'">Show Certificates</button>
    <div id="cert-section" class="certificates">
      <img src="certificate1.jpg" alt="Certificate 1">
      <img src="certificate2.jpg" alt="Certificate 2">
    </div>
  </section>

  <footer id="contact" class="restaurant-style">
    <h2>Contact Me</h2>
    <p>Email: your.email@example.com</p>
    <p>GitHub: github.com/yourprofile</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight * 0.5);
    document.getElementById('cube-container').appendChild(renderer.domElement);

    const geometry = new THREE.BoxGeometry();
    const materials = [
      new THREE.MeshBasicMaterial({ color: 0xff0000 }),
      new THREE.MeshBasicMaterial({ color: 0x00ff00 }),
      new THREE.MeshBasicMaterial({ color: 0x0000ff }),
      new THREE.MeshBasicMaterial({ color: 0xffff00 }),
      new THREE.MeshBasicMaterial({ color: 0xff00ff }),
      new THREE.MeshBasicMaterial({ color: 0x00ffff })
    ];
    const cube = new THREE.Mesh(geometry, materials);
    scene.add(cube);

    camera.position.z = 3;

    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.x += 0.01;
      cube.rotation.y += 0.01;
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
